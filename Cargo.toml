[package]
name = "solder"
license = "Unlicense"
version = "0.2.0"
edition = "2024"
# Someone already took this crate name
publish = false

[[bin]]
name = "solder"
path = "src/main.rs"

[dependencies]
# `default-features = false` drops object's `compression` feature, which solder
# never uses: it only decompresses `SHF_COMPRESSED`/`.zdebug_*` sections, and
# nothing here calls `uncompressed_data`. Left on, it pulled `ruzstd` and
# `flate2` — and with them a zstd decompression bomb (RUSTSEC-2026-0344) — into
# a tool whose whole input is attacker-supplied ELF.
object = { version = "0.40", default-features = false, features = [
    "read_core",
    "elf",
    "std",
] }
goblin = "0.10"
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indexmap = "2"
petgraph = "0.8"
iced-x86 = { version = "1.21.0", features = ["decoder", "instr_info"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
